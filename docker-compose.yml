
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opsmonitor-backend-dev
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - default
      - telemetry

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opsmonitor-frontend-dev
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: opsmonitor-docker-proxy-dev
    environment:
      CONTAINERS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - docker_api

  telemetry-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: opsmonitor-agent-dev
    environment:
      DOCKER_API_HOST: http://docker-socket-proxy:2375
      PORT: "5001"
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - telemetry
      - docker_api

networks:
  default: {}
  telemetry:
    internal: true
  docker_api:
    internal: true
