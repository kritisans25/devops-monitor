services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: opsmonitor-backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: opsmonitor-frontend

    ports:
      - "3000:80"

    restart: unless-stopped

    depends_on:
      - backend